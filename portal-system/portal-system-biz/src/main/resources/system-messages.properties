# 校验消息 —— 中文（默认语言，无后缀文件即兜底）
# 语言由请求头 Accept-Language 决定：en-US 命中 system-messages_en_US，其余回落本文件
# 注意：本文件位于 portal-system-biz，归属 system 模块；新增模块请用
# 自己的基名（如 scrm-messages）并在 portal-boot 的 spring.messages.basename 追加，
# 避免多 jar 同名 messages.properties 在 classpath 上互相遮蔽

# ===== 菜单(sys_menu) =====
menu.name.notblank=菜单名称不能为空
menu.name.size=菜单名称长度必须在 {min}-{max} 个字符之间
menu.menuType.notblank=菜单类型不能为空
menu.menuType.size=菜单类型长度不能超过 {max} 个字符
menu.path.size=路由路径长度不能超过 {max} 个字符
menu.component.size=页面组件长度不能超过 {max} 个字符
menu.authCode.size=权限标识长度不能超过 {max} 个字符

# ===== 角色(sys_role) =====
role.name.notblank=角色名称不能为空
role.name.size=角色名称长度必须在 {min}-{max} 个字符之间
role.remark.size=备注长度不能超过 {max} 个字符
role.dataScope.notnull=数据权限不能为空

# ===== 国际化词条(sys_i18n) =====
i18n.name.notblank=词条键名不能为空
i18n.name.size=词条键名长度必须在 {min}-{max} 个字符之间
i18n.zh.size=中文文案长度不能超过 {max} 个字符
i18n.en.size=英文文案长度不能超过 {max} 个字符

# ===== 部门(sys_dept) =====
dept.name.notblank=部门名称不能为空
dept.name.size=部门名称长度不能超过 {max} 个字符
dept.hasChildren=存在子部门，不能删除
dept.parentInvalid=上级部门不能是自身或自己的子部门

# ===== 通用 =====
validation.id.notnull=ID不能为空

# ===== 查询参数（单边上限） =====
menu.name.max=菜单名称长度不能超过 {max} 个字符
role.name.max=角色名称长度不能超过 {max} 个字符
i18n.name.max=词条键名长度不能超过 {max} 个字符

# ===== 字典(sys_dict / sys_dict_item) =====
dict.type.notblank=字典类型不能为空
dict.type.size=字典类型长度必须在 {min}-{max} 个字符之间
dict.description.max=描述长度不能超过 {max} 个字符
dict.remarks.max=备注长度不能超过 {max} 个字符
dict.system.cannotDelete=系统内置字典不能删除
dictItem.dictId.notnull=所属字典不能为空
dictItem.label.notblank=字典项标签不能为空
dictItem.label.size=字典项标签长度必须在 {min}-{max} 个字符之间
dictItem.value.notblank=字典项值不能为空
dictItem.value.size=字典项值长度必须在 {min}-{max} 个字符之间
dictItem.description.max=描述长度不能超过 {max} 个字符
dictItem.remarks.max=备注长度不能超过 {max} 个字符

# ===== 文件(sys_file / sys_file_group) =====
file.name.notblank=文件名不能为空
file.name.size=文件名长度必须在 {min}-{max} 个字符之间
file.name.max=文件名长度不能超过 {max} 个字符
file.bucket.max=存储桶名长度不能超过 {max} 个字符
file.dir.max=存储目录长度不能超过 {max} 个字符
file.original.max=原始文件名长度不能超过 {max} 个字符
file.type.max=文件类型长度不能超过 {max} 个字符
fileGroup.name.notblank=分组名称不能为空
fileGroup.name.size=分组名称长度必须在 {min}-{max} 个字符之间
fileGroup.hasChildren=分组下存在子分组，不能删除
fileGroup.hasFiles=分组下存在文件，不能删除

# ===== 文件上传 =====
file.upload.empty=上传文件不能为空
file.upload.tooLarge=文件大小超过限制
file.upload.illegalType=不支持的文件类型
file.upload.failed=文件保存失败
file.notFound=文件不存在或已被删除
file.ids.notempty=请先选择文件
file.category.max=类型分类参数非法

dict.description.notblank=字典名称不能为空
dict.description.size=字典名称长度必须在 {min}-{max} 个字符之间

file.storage.s3.bucketMissing=对象存储未配置存储桶（file.storage.s3.bucket）
