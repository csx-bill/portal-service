# =========================================================
# 文件存储配置
# upload-type 决定使用哪种存储：local（默认）| s3，二者只会生效一个，
# 不生效的那一段配置不会被读取，可以直接删掉
# =========================================================
file:
  upload-type: local
  # upload-type: local 时生效
  local:
    # 本地文件存储根目录
    # 下发地址为 /{bucket}/{clientId}/{dir}/{fileName}（桶名默认 local，即 /local/{clientId}/xxx.png）
    # 本地开发：应用直接服务该前缀，前端把 /{bucket} 代理到应用即可（见 LocalFileResourceConfig）
    # 生产环境：由 nginx 映射到本目录下的同名子目录：location /local/ { alias {base-path}/local/; }
    base-path: ./data/files
  # upload-type: s3 时生效
  s3:
    # 切换为 s3 时填写真实地址与密钥
    endpoint: http://127.0.0.1:9000
    # 下载地址使用的对外地址，客户端访问不到 endpoint（如容器内网地址）时配置
    public-endpoint: http://127.0.0.1:9000
    region: us-east-1
    access-key: minioadmin
    secret-key: minioadmin
    # 访问风格：false = virtual-host（默认，桶名作为子域，AWS S3 / 新 SDK 标准做法；
    #   需要 DNS 能把 {bucket}.{endpoint} 解析到对象存储，MinIO 需配置 MINIO_DOMAIN）
    #   true = path style（桶名在路径里，MinIO 用 IP 直连等无域名场景使用）
    path-style-access: false
    # 请求体编码：AWS S3 / MinIO / 腾讯云 COS 保持 true；阿里云 OSS 不支持 aws-chunked，需设为 false
    chunked-encoding: true
