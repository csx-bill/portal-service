server:
  port: 8080

spring:
  application:
    name: portal-service
  servlet:
    multipart:
      # 文件管理不限制文件大小（-1 为不限），仅受磁盘空间约束
      max-file-size: -1
      max-request-size: -1
  messages:
    # 各业务模块的消息资源基名（逗号分隔追加），默认语言为基名无后缀文件（中文）
    basename: system-messages
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  datasource:
    #driver-class-name: com.mysql.cj.jdbc.Driver
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://127.0.0.1:3306/portal-service?useSSL=false&useUnicode=true&characterEncoding=UTF-8
    username: root
    password: 123456

