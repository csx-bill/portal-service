# knife4j的增强配置
knife4j:
  enable: true
  setting:
    language: zh-CN
  # 是否生产环境
  production: false


# =========================================================
# 安全配置：免认证地址（Ant 风格）
# 命中这些路径的请求跳过【所有】拦截器（租户/客户端/数据权限/Sa-Token），
# 适用于登录、OAuth2、第三方回调等无令牌无请求头的入口
# =========================================================
security:
  ignore-urls:
    - /oauth2/**
    # 企微回调：腾讯服务器匿名调用
    - /scrm/cp/self/**

############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # 请求头形如 "Authorization: Bearer xxx"，StpUtil 读取时剥离 Bearer 前缀
  token-prefix: Bearer
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: random-64
  # 是否输出操作日志
  is-log: true


